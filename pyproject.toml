[project]
name = "elgss"
version = "1.0.0"
description = "ERQ-Net: Language-Structured Relational Q-Learning for threat-aware control in safety-critical driving"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Aditya Humnabadkar" },
    { name = "Huaizhong Zhang" },
    { name = "Ardhendu Behera" },
]
dependencies = [
    "torch>=2.0",
    "torch-geometric>=2.3",
    "gymnasium>=0.29",
    "highway-env==1.12.0",
    "numpy>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elgss"]
